name: '▶️ Gemini Invoke (Diagnostic)'

on:
  workflow_dispatch:

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'

      - name: 'SETUP: Run Gemini CLI with Full Diagnostics'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          TITLE: 'Diagnostic Run'
          DESCRIPTION: 'Testing the gemini-dispatch workflow'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          gemini_cli_version: 'latest'
          gemini_debug: 'true'
          prompt: 'Hello, world!'
